name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

# A new push to the same PR/branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: lint-typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The Prisma client is generated code (git-ignored). Type-aware ESLint needs it,
      # otherwise every Prisma call is `any` and no-unsafe-* rules fail.
      - run: npm run db:generate --workspace=@income-expenses/api
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck

  test-api:
    name: test-api
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: income_expenses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d income_expenses_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Read by apps/api/vitest.config.ts; the name must end with _test (safety guard).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/income_expenses_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate --workspace=@income-expenses/api
      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Test with coverage (fails under 70 %)
        run: npm run test:coverage --workspace=@income-expenses/api
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          retention-days: 14

  test-web:
    name: test-web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test --workspace=@income-expenses/web

  build-images:
    name: build-images (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: apps/api/Dockerfile
            target: runtime
          - image: migrate
            dockerfile: apps/api/Dockerfile
            target: migrate
          - image: web
            dockerfile: apps/web/Dockerfile
            target: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          # Layer cache in GitHub Actions: unchanged dependencies are not reinstalled.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
