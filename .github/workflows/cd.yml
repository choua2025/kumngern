name: CD

# develop → staging, main → production (production deploys wait for a reviewer).
# Only the app(s) that changed are built and deployed; the API always goes before the web.
# Manual run (Actions → CD → Run workflow) = redeploy or roll back any image tag.
# Deploy jobs run only when the repository variable DEPLOY_ENABLED is "true" (set it once
# the server and the GitHub Environments are ready); until then CD only builds and pushes.
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true
      service:
        description: What to deploy
        type: choice
        options: [both, api, web]
        default: both
      image-tag:
        description: Existing image tag (git SHA) to deploy. Empty = build the selected branch.
        type: string
        required: false

# Never run two deployments of the same branch at once; never cancel one halfway.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # push images to ghcr.io with GITHUB_TOKEN

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-24.04
    outputs:
      environment: ${{ steps.plan.outputs.environment }}
      api: ${{ steps.plan.outputs.api }}
      web: ${{ steps.plan.outputs.web }}
      build: ${{ steps.plan.outputs.build }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          # Compare with the commit before this push (the previous state of the branch).
          base: ${{ github.event.before }}
          filters: .github/filters.yml
      - name: Decide environment, apps and tag
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          API_CHANGED: ${{ steps.filter.outputs.api }}
          WEB_CHANGED: ${{ steps.filter.outputs.web }}
          IN_ENV: ${{ inputs.environment }}
          IN_SERVICE: ${{ inputs.service }}
          IN_TAG: ${{ inputs.image-tag }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            environment="$IN_ENV"
            api=$([ "$IN_SERVICE" != "web" ] && echo true || echo false)
            web=$([ "$IN_SERVICE" != "api" ] && echo true || echo false)
            if [ -n "$IN_TAG" ]; then build=false; tag="$IN_TAG"; else build=true; tag="$GITHUB_SHA"; fi
          else
            environment=$([ "$REF" = "main" ] && echo production || echo staging)
            api="${API_CHANGED:-false}"; web="${WEB_CHANGED:-false}"; build=true; tag="$GITHUB_SHA"
          fi
          {
            echo "environment=$environment"; echo "api=$api"; echo "web=$web"
            echo "build=$build"; echo "tag=$tag"
          } | tee -a "$GITHUB_OUTPUT"
          {
            echo "### Deployment plan"
            echo "| environment | api | web | build | tag |"
            echo "|---|---|---|---|---|"
            echo "| $environment | $api | $web | $build | \`${tag:0:12}\` |"
            if [ "$DEPLOY_ENABLED" != "true" ]; then
              echo ""
              echo "> ⚠️ Deploy skipped: repository variable \`DEPLOY_ENABLED\` is not \`true\` (see docs/cicd.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-api:
    name: api · build & push (${{ matrix.image }})
    needs: plan
    if: needs.plan.outputs.api == 'true' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: api
            target: runtime
          - image: migrate
            target: migrate
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: ${{ matrix.target }}
          push: true
          # Immutable SHA tag (what we deploy/roll back to) + moving tag for humans.
          tags: |
            ${{ env.REGISTRY }}/income-expenses-${{ matrix.image }}:${{ needs.plan.outputs.tag }}
            ${{ env.REGISTRY }}/income-expenses-${{ matrix.image }}:${{ needs.plan.outputs.environment == 'production' && 'latest' || 'staging' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  build-web:
    name: web · build & push
    needs: plan
    if: needs.plan.outputs.web == 'true' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ env.REGISTRY }}/income-expenses-web:${{ needs.plan.outputs.tag }}
            ${{ env.REGISTRY }}/income-expenses-web:${{ needs.plan.outputs.environment == 'production' && 'latest' || 'staging' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy-api:
    name: api
    needs: [plan, build-api]
    # build-api is skipped for a manual rollback (image already exists).
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && needs.plan.outputs.api == 'true' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ needs.plan.outputs.environment }}
      service: api
      image-tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit

  deploy-web:
    name: web
    # Web waits for the API: a new frontend may call a new endpoint.
    needs: [plan, build-web, deploy-api]
    if: >-
      always() && vars.DEPLOY_ENABLED == 'true' && needs.plan.outputs.web == 'true' &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.deploy-api.result == 'success' || needs.deploy-api.result == 'skipped')
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ needs.plan.outputs.environment }}
      service: web
      image-tag: ${{ needs.plan.outputs.tag }}
    secrets: inherit
