# Production / staging stack on the server. Images come from ghcr.io; nothing is built here.
#
#   cd /opt/income-expenses/production    (or staging)
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml run --rm migrate          # apply migrations
#   ./deploy.sh api <sha> | ./deploy.sh web <sha>                      # what CD runs
#
# Values come from .env next to this file (chmod 600, never in Git) — see .env.example.
# Staging and production use different COMPOSE_PROJECT_NAME and WEB_PORT (8081 / 8080).
name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

# Image tags default to "not-deployed" so one app can be deployed before the other exists
# (e.g. the very first deploy). Starting a service whose tag is unset fails loudly on pull.
x-database-url: &database-url postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: UTC
      PGTZ: UTC
      PGUSER: ${POSTGRES_USER:?}
      PGDATABASE: ${POSTGRES_DB:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No "ports:" — the database is reachable only from the backend network.
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  api:
    image: ghcr.io/${GHCR_OWNER:?}/income-expenses-api:${API_IMAGE_TAG:-not-deployed}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: *database-url
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      # host nginx → web nginx → api = 2 proxy hops (for req.ip and the rate limiter)
      TRUST_PROXY: 2
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ''
      CRON_ENABLED: ${CRON_ENABLED:-true}
      CRON_TZ: ${CRON_TZ:-Asia/Bangkok}
    volumes:
      - uploads:/app/uploads
    networks: [backend, frontend]
    logging: *logging

  web:
    image: ghcr.io/${GHCR_OWNER:?}/income-expenses-web:${WEB_IMAGE_TAG:-not-deployed}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Loopback only: the host's nginx (TLS) is the single entry point from the Internet.
    ports:
      - '127.0.0.1:${WEB_PORT:?}:80'
    networks: [frontend]
    logging: *logging

  # One-off job, not a long-running service: `docker compose run --rm migrate`
  # (`... run --rm migrate npm run db:seed` loads demo data on staging).
  migrate:
    image: ghcr.io/${GHCR_OWNER:?}/income-expenses-migrate:${API_IMAGE_TAG:-not-deployed}
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url
    networks: [backend]
    logging: *logging

networks:
  # internal: containers on it cannot reach the Internet and nothing on it can be published.
  backend:
    internal: true
  frontend: {}

volumes:
  pgdata:
  uploads:
