# Security headers for everything this nginx serves itself (HTML, JS, CSS).
# Included in EVERY location that has its own add_header: nginx drops inherited
# add_header directives as soon as a location defines one (a classic pitfall).
# API responses get theirs from helmet, so /api/ does not include this file.

# Only same-origin code; blob: = attachment thumbnails, data: = small inline images.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
# Browsers ignore HSTS over plain HTTP, so this is harmless in local Docker.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
