# Served inside the `web` container (nginx:alpine). TLS is terminated by nginx on the HOST
# (deploy/host/). Security headers live HERE (security-headers.conf), versioned with the app,
# because the CSP must match the code this image ships.

# Keep the scheme the browser really used (set by the host nginx); fall back to ours.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Attachments (Phase 13): 3 files × 5 MB plus multipart overhead.
  client_max_body_size 20m;

  # Docker's embedded DNS. With a variable in proxy_pass, nginx re-resolves "api" instead
  # of caching its IP forever — otherwise redeploying the api container (new IP) would
  # cause 502s until this container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Appends this hop; the API trusts exactly TRUST_PROXY hops of this header.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    # Same id in nginx and API logs (the API accepts a safe incoming X-Request-Id).
    proxy_set_header X-Request-Id $request_id;
    proxy_read_timeout 60s;
  }

  # Liveness of this container only (does not touch the API).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Vite puts a content hash in every asset file name → safe to cache "forever".
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
  }

  # index.html must never be cached, or users keep loading old asset hashes after a deploy.
  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Not content-hashed (it must load before the bundle), so revalidate like index.html.
  location = /boot.js {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # SPA fallback: /transactions, /budgets … are client-side routes → serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/security-headers.conf;
  }
}
